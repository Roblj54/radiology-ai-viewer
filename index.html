<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <title>Radiology AI Colombia Health</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Radiology AI Colombia Health - DICOM viewer with basic AI toolbar." />
    <link rel="stylesheet" href="/src/radiology.css" />
    <!-- RAI-SPA-INDEX -->
  <script>
    (function () {
      var l = window.location;
      if (l.search && l.search.indexOf('?/') === 0) {
        var route = l.search.slice(1); // starts with "/"
        var newPath = l.pathname.replace(/\/$/, '') + route + l.hash;
        window.history.replaceState(null, '', newPath);
      }
    })();
  </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
