# RAI_AUTOPILOT_MANAGED
name: Deploy GitHub Pages (RAI Autopilot)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Autopilot build
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./RAI_Autopilot_Online.ps1 -Ci -AutoFix -EnsureWorkflow

      - name: Upload autopilot logs
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-logs
          path: logs_autopilot/**
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4